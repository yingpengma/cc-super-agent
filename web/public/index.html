<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f1">
<title>Super-agent</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- Source Serif 4 for the Router's replies; falls back to Georgia offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<svg class="sprite" width="0" height="0" aria-hidden="true">
  <defs>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M3.7 3.3 21 12 3.7 20.7 6 12 3.7 3.3ZM6 12h8" /></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></symbol>
    <symbol id="i-term" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6M12 19h8" /></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1" /><rect x="14" y="4" width="4" height="16" rx="1" /></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4v16l14-8z" /></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM12 8v4M12 16h.01" /></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M9 3v18" /></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10M18.4 6.6a9 9 0 1 1-12.8 0" /></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8" /></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 22V4M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1" /></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path d="M3 21c3 0 7-1 7-8V5H3v7h4c0 4-2 6-4 6zM14 21c3 0 7-1 7-8V5h-7v7h4c0 4-2 6-4 6z" /></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01" /></symbol>
  </defs>
</svg>

<div id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <img src="icon.svg" alt="" width="44" height="44">
    <h1 data-i18n="loginTitle"></h1>
    <p data-i18n="loginHelp"></p>
    <label for="login-token" data-i18n="loginLabel"></label>
    <input id="login-token" type="password" autocomplete="off" spellcheck="false" required>
    <p id="login-error" class="error" hidden data-i18n="loginWrong"></p>
    <button type="submit" class="btn primary" data-i18n="loginButton"></button>
  </form>
</div>

<div id="app" class="app show-chat" hidden>
  <nav class="switch seg" role="tablist">
    <button role="tab" class="seg-item" data-pane="side" aria-selected="false"><svg><use href="#i-panel"/></svg><span data-i18n="inFlight"></span></button>
    <button role="tab" class="seg-item" data-pane="group" aria-selected="false"><svg><use href="#i-users"/></svg><span data-i18n="group"></span><span class="count" id="count-group"></span></button>
    <button role="tab" class="seg-item" data-pane="chat" aria-selected="true"><svg><use href="#i-chat"/></svg><span>Router</span></button>
  </nav>

  <aside class="pane side" id="side" aria-labelledby="side-title">
    <div class="side-head">
      <span class="side-title" id="side-title" data-i18n="work"></span>
      <button id="side-toggle" class="icon-btn" aria-controls="side" aria-expanded="true"><svg><use href="#i-panel"/></svg></button>
    </div>
    <div class="side-full">
      <div class="seg side-tabs" role="tablist">
        <button role="tab" class="seg-item" data-side-tab="tasks" aria-selected="true"><span data-i18n="inFlight"></span><span class="count" id="count-tasks"></span></button>
        <button role="tab" class="seg-item" data-side-tab="runs" aria-selected="false"><span data-i18n="workers"></span><span class="count" id="count-runs"></span></button>
      </div>
      <div class="side-list">
        <ul class="list" id="tasks" role="tabpanel"></ul>
        <ul class="list" id="runs" role="tabpanel" hidden></ul>
      </div>
    </div>
    <ul class="rail" id="rail"></ul>
  </aside>

  <section class="pane group-pane" aria-labelledby="group-title">
    <header class="top">
      <div class="title">
        <h1 id="group-title" data-i18n="group"></h1>
        <p id="group-sub"></p>
      </div>
      <div id="pause-area"></div>
    </header>
    <div id="alerts"></div>
    <div class="chips" id="chips" role="toolbar"></div>
    <div class="task-bar" id="task-bar" hidden></div>
    <div class="feed-scroll" id="feed-scroll">
      <div class="feed" id="feed" role="log"></div>
    </div>
  </section>

  <section class="pane main">
    <header class="top">
      <div class="title">
        <h1>Router</h1>
        <p id="router-status" aria-live="polite"></p>
      </div>
      <div class="seg tabs" role="tablist">
        <button role="tab" class="seg-item" data-view="chat" aria-selected="true"><svg><use href="#i-chat"/></svg><span data-i18n="chat"></span></button>
        <button role="tab" class="seg-item" data-view="term" aria-selected="false"><svg><use href="#i-term"/></svg><span data-i18n="terminal"></span></button>
      </div>
    </header>

    <div class="view" id="view-chat">
      <div class="chat-scroll" id="chat-scroll" tabindex="-1">
        <div class="chat-inner" id="messages" role="log" aria-live="polite"></div>
      </div>
      <div class="dock">
        <section id="banner" hidden></section>
        <form id="composer" class="composer">
          <div class="quote" id="quote" hidden></div>
          <label for="input" class="sr-only" data-i18n="inputLabel"></label>
          <textarea id="input" rows="2" data-i18n-placeholder="inputPlaceholder"></textarea>
          <div class="composer-foot">
            <span class="hint" data-i18n="hint"></span>
            <button type="submit" id="send" class="send" data-i18n-label="send"><svg><use href="#i-send"/></svg></button>
          </div>
        </form>
      </div>
    </div>

    <div class="view" id="view-term" hidden>
      <div class="term-wrap">
        <p class="term-note" data-i18n="terminalNote"></p>
        <pre class="screen" id="term-screen"></pre>
        <div class="keys" id="term-keys"></div>
      </div>
    </div>
  </section>
</div>

<dialog id="task-dialog" class="sheet" aria-labelledby="task-dialog-title">
  <div class="sheet-head">
    <h2 id="task-dialog-title"></h2>
    <button class="icon-btn" data-close data-i18n-label="close"><svg><use href="#i-x"/></svg></button>
  </div>
  <div class="sheet-body prose" id="task-dialog-body"></div>
</dialog>
</body>
</html>
